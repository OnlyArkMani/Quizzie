version: '3.9'

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: quizzie_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB:       ${POSTGRES_DB:-quizzie_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: quizzie_redis
    restart: unless-stopped
    # volatile-lru, not allkeys-lru: this one Redis is also the Celery broker.
    # Under memory pressure allkeys-lru may evict a queue (a list with no TTL),
    # silently dropping queued tasks. volatile-lru only evicts keys that have a
    # TTL (cache, locks, rate-limit windows all do); if nothing is evictable,
    # writes fail loudly instead (backpressure, not data loss).
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PgBouncer (optional: `docker compose --profile pgbouncer up`) ─────────
  # Connection budget without PgBouncer (default max_connections = 100):
  #   backend 4 workers x (10 + 5)          = 60
  #   celery_proctoring 4 procs x (2 + 0)   =  8
  #   celery_evaluation 2 procs x (2 + 0)   =  4    -> 72 of 100, 28 spare
  # Adding API replicas multiplies the first line. Beyond that, point the
  # backend's DATABASE_URL at pgbouncer:6432 (transaction pooling: thousands of
  # client connections share ~40 real ones) and keep MIGRATION_DATABASE_URL on
  # postgres:5432 — the migration advisory lock needs a real session.
  # Not exercised in this repo's CI; pin an image version before production use.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: ["pgbouncer"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-quizzie_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "40"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:5432"

  # ─── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizzie_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-quizzie_db}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-quizzie_db}
      REDIS_URL: redis://redis:6379/0
      WORKERS: "4"
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "5"
      # Trust X-Forwarded-For from the nginx container. Safe only while the
      # backend is reached through nginx; don't publish port 8000 publicly in
      # production, or clients could spoof their IP to dodge per-IP limits.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ─── Celery Worker: Proctoring (AI) ───────────────────────────────────────
  # Separate from web process — MediaPipe loads ONLY here, not in FastAPI
  celery_proctoring:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizzie_celery_proctoring
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker -Q proctoring --concurrency=4 --loglevel=info
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-quizzie_db}
      REDIS_URL: redis://redis:6379/0
      # One task at a time per process: 1-2 connections is all it can use.
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Celery Worker: Evaluation ─────────────────────────────────────────────
  celery_evaluation:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizzie_celery_evaluation
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker -Q evaluation --concurrency=2 --loglevel=info
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-quizzie_db}
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Frontend (React → nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quizzie_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend

volumes:
  postgres_data:
